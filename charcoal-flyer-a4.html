<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charcoal Shawarma & Tandoori Flyer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --charcoal: #151515;
            --ember-orange: #FF6B1A;
            --fire-red: #D8331A;
            --gold: #C9A227;
            --white: #F8F8F8;
        }
        
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        @page {
            size: A4 portrait;
            margin: 0;
        }

        .flyer-container {
            width: 210mm;
            height: 297mm;
            background-color: var(--charcoal);
            position: relative;
            margin: 0 auto;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            color: var(--white);
            font-family: 'Inter', sans-serif;
        }

        @media print {
            body { background-color: var(--charcoal); }
            .flyer-container { margin: 0; box-shadow: none; }
        }

        /* Background Texture */
        .bg-texture {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('C:/Users/eluri/.gemini/antigravity-ide/brain/8afb4090-434f-4bff-b60c-4a5e686ac153/smoke_embers_bg_1788703906543.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.6;
            z-index: 1;
            pointer-events: none;
            mix-blend-mode: screen;
        }

        /* Content Wrapper (keeps it above bg) */
        .content {
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15mm; /* Safe print margin */
        }

        /* TOP HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 5mm;
        }
        .brand-cluster {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #000;
            border: 2px solid var(--gold);
            background-image: url('logo.jpg'); /* Real logo from workspace */
            background-size: cover;
            background-position: center;
        }
        .brand-credit {
            font-size: 11px;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .ribbon {
            background-color: var(--gold);
            color: #000;
            font-family: 'Anton', sans-serif;
            font-size: 16px;
            padding: 6px 16px;
            letter-spacing: 2px;
            clip-path: polygon(0 0, 100% 0, 90% 50%, 100% 100%, 0 100%);
            margin-top: 5px;
        }

        /* HEADLINE */
        .headline-section {
            text-align: center;
            margin-bottom: 8mm;
        }
        .headline {
            font-family: 'Anton', sans-serif;
            font-size: 58px;
            line-height: 1.05;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            /* Flame Gradient Effect */
            background: linear-gradient(180deg, #FFD700 0%, #FF6B1A 40%, #D8331A 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 4px 15px rgba(216, 51, 26, 0.4));
        }
        .tagline {
            font-size: 18px;
            font-style: italic;
            font-weight: 600;
            color: #ddd;
            margin: 0;
            letter-spacing: 1px;
        }

        /* HERO IMAGE */
        .hero-container {
            width: 100%;
            height: 100mm;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 12mm;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 2px solid #333;
            position: relative;
        }
        .hero-container::after {
            content: "";
            position: absolute;
            top:0; left:0; right:0; bottom:0;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8); /* Vignette */
            pointer-events: none;
        }
        .hero-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /* HIGHLIGHT STRIP */
        .highlights {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: auto; /* pushes footer down */
        }
        .highlight-item {
            flex: 1;
            text-align: center;
        }
        .highlight-img-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #444;
            margin-bottom: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .highlight-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .highlight-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* FOOTER / CTA */
        .footer {
            text-align: center;
            border-top: 1px solid var(--gold);
            padding-top: 8mm;
            margin-top: 15mm;
        }
        .cta-text {
            font-family: 'Anton', sans-serif;
            font-size: 26px;
            color: var(--white);
            letter-spacing: 1.5px;
            margin: 0 0 10px 0;
            text-transform: uppercase;
        }
        .contact-info {
            font-size: 14px;
            line-height: 1.6;
            color: #ccc;
            margin-bottom: 12px;
        }
        .contact-info strong {
            color: var(--white);
        }
        .icon {
            color: var(--ember-orange);
            margin-right: 5px;
        }
        .sub-brand {
            font-size: 10px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="flyer-container">
        <div class="bg-texture"></div>
        
        <div class="content">
            <!-- HEADER -->
            <div class="header">
                <div class="brand-cluster">
                    <div class="logo-circle"></div>
                    <div class="brand-credit">By Maestro Kitchen</div>
                </div>
                <div class="ribbon">OPENING SOON</div>
            </div>

            <!-- HEADLINE -->
            <div class="headline-section">
                <h1 class="headline">Charcoal Shawarma<br>& Tandoori</h1>
                <p class="tagline">Where Smoke Meets Flavor.</p>
            </div>

            <!-- HERO -->
            <div class="hero-container">
                <img src="C:/Users/eluri/.gemini/antigravity-ide/brain/8afb4090-434f-4bff-b60c-4a5e686ac153/hero_shawarma_new_1788704596628.jpg" alt="Hero Shawarma" class="hero-image">
            </div>

            <!-- HIGHLIGHTS -->
            <div class="highlights">
                <div class="highlight-item">
                    <div class="highlight-img-wrapper">
                        <img src="C:/Users/eluri/.gemini/antigravity-ide/brain/8afb4090-434f-4bff-b60c-4a5e686ac153/thumb_shawarma_new_1788704609860.jpg" alt="Charcoal Shawarma">
                    </div>
                    <div class="highlight-label">Shawarma</div>
                </div>
                <div class="highlight-item">
                    <div class="highlight-img-wrapper">
                        <img src="C:/Users/eluri/.gemini/antigravity-ide/brain/8afb4090-434f-4bff-b60c-4a5e686ac153/thumb_tandoori_new_1788704622158.jpg" alt="Tandoori Chicken">
                    </div>
                    <div class="highlight-label">Tandoori</div>
                </div>
                <div class="highlight-item">
                    <div class="highlight-img-wrapper">
                        <img src="C:/Users/eluri/.gemini/antigravity-ide/brain/8afb4090-434f-4bff-b60c-4a5e686ac153/thumb_seekh_new_1788704632897.jpg" alt="Seekh Kebab">
                    </div>
                    <div class="highlight-label">Seekh Kebab</div>
                </div>
                <div class="highlight-item">
                    <div class="highlight-img-wrapper">
                        <img src="C:/Users/eluri/.gemini/antigravity-ide/brain/8afb4090-434f-4bff-b60c-4a5e686ac153/thumb_tikka_new_1788704644231.jpg" alt="Chicken Tikka">
                    </div>
                    <div class="highlight-label">Chicken Tikka</div>
                </div>
            </div>

            <!-- FOOTER -->
            <div class="footer">
                <h2 class="cta-text">Coming soon &mdash; come find us!</h2>
                <div class="contact-info">
                    <span class="icon">📍</span> <strong>Beside Complex, Raithu Bazar Road, Vanasthalipuram, Hyderabad</strong><br>
                    <span class="icon">📞</span> <strong>+91 81435 59194</strong>
                </div>
                <div class="sub-brand">A Maestro Kitchen Venture</div>
            </div>
        </div>
    </div>
</body>
</html>
